<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10231c">
  <!-- After `npx wrangler deploy`, paste the printed workers.dev URL here. -->
  <meta name="bus-rides-api" content="">
  <title>Bus rides</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2310231c'/%3E%3Crect x='6' y='8' width='20' height='14' rx='3' fill='%23f5c400'/%3E%3Ccircle cx='11' cy='24' r='2' fill='%23f6f3ec'/%3E%3Ccircle cx='21' cy='24' r='2' fill='%23f6f3ec'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #10231c;
      --paper: #f6f3ec;
      --muted: #5c675f;
      --line: #e2dcd0;
      --yellow: #f5c400;
      --yellow-press: #dfb200;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--ink);
      color: var(--paper);
      padding: 1.25rem 1.25rem 1.1rem;
    }

    header p {
      margin: 0 0 0.2rem;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    main {
      flex: 1;
      width: min(100%, 28rem);
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .label {
      margin: 0.5rem 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .count {
      margin: 0.15rem 0 1.5rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 760;
      font-size: clamp(6.5rem, 32vw, 9.5rem);
      line-height: 0.9;
      letter-spacing: -0.05em;
    }

    button {
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #add {
      border: 0;
      border-radius: 999px;
      min-height: 4.5rem;
      background: var(--yellow);
      color: var(--ink);
      font-size: 1.35rem;
      font-weight: 750;
      box-shadow: 0 1px 0 rgba(16, 35, 28, 0.18);
    }

    #add:hover { background: var(--yellow-press); }
    #add:active { transform: translateY(1px); }
    #add:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    #undo {
      margin-top: 0.85rem;
      border: 0;
      background: transparent;
      color: var(--muted);
      min-height: 3rem;
      font-size: 1.05rem;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    #undo:hover:not(:disabled) { color: var(--ink); }
    #undo:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
      border-radius: 8px;
    }

    #undo:disabled {
      opacity: 0.35;
      cursor: default;
      text-decoration: none;
    }

    .hint {
      margin: auto 0 0;
      padding-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--line);
    }

    .error {
      min-height: 1.25rem;
      margin: 0.85rem 0 0;
      text-align: center;
      color: #8a2b1d;
      font-size: 0.95rem;
    }

    #add:disabled {
      opacity: 0.55;
      cursor: default;
    }
  </style>
</head>
<body>
  <header>
    <p>Counter</p>
    <h1>Bus rides</h1>
  </header>
  <main>
    <p class="label">Times you’ve taken the bus</p>
    <p class="count" id="count" aria-live="polite">…</p>
    <button type="button" id="add">Took the bus</button>
    <button type="button" id="undo">Undo</button>
    <p class="error" id="error" hidden></p>
    <p class="hint">Saved on the server, for every device.</p>
  </main>
  <script>
    (function () {
      var CACHE_KEY = "bus-rides-last";
      var countEl = document.getElementById("count");
      var addBtn = document.getElementById("add");
      var undoBtn = document.getElementById("undo");
      var errorEl = document.getElementById("error");
      var busy = false;
      var count = null;

      function apiBase() {
        var host = location.hostname;
        if (host === "localhost" || host === "127.0.0.1") return "http://127.0.0.1:8787";
        var meta = document.querySelector('meta[name="bus-rides-api"]');
        return meta && meta.content ? meta.content.replace(/\/$/, "") : "";
      }

      function readCache() {
        try {
          var n = parseInt(localStorage.getItem(CACHE_KEY), 10);
          if (!isFinite(n) || n < 0) return null;
          return Math.floor(n);
        } catch (err) {
          return null;
        }
      }

      function writeCache(n) {
        try {
          localStorage.setItem(CACHE_KEY, String(n));
        } catch (err) {
          /* Cache is only a display hint when the server is unreachable. */
        }
      }

      function showError(message) {
        errorEl.hidden = !message;
        errorEl.textContent = message || "";
      }

      function render(next) {
        count = next;
        countEl.textContent = next === null ? "…" : String(next);
        undoBtn.disabled = busy || next === null || next === 0;
        addBtn.disabled = busy || next === null && !apiBase();
      }

      function setBusy(next) {
        busy = next;
        addBtn.disabled = busy || (count === null && !apiBase());
        undoBtn.disabled = busy || count === null || count === 0;
      }

      function call(path, method) {
        var base = apiBase();
        if (!base) {
          return Promise.reject(new Error("missing api"));
        }
        return fetch(base + path, {
          method: method,
          headers: { Accept: "application/json" }
        }).then(function (res) {
          if (!res.ok) throw new Error("status " + res.status);
          return res.json();
        }).then(function (body) {
          var n = Number(body && body.count);
          if (!isFinite(n) || n < 0) throw new Error("bad count");
          return Math.floor(n);
        });
      }

      function apply(n) {
        render(n);
        writeCache(n);
        showError("");
      }

      function fail(message) {
        showError(message);
        setBusy(false);
      }

      function refresh() {
        setBusy(true);
        call("/count", "GET").then(function (n) {
          setBusy(false);
          apply(n);
        }).catch(function () {
          fail(apiBase()
            ? "Couldn’t reach the counter."
            : "The counter server isn’t set up yet.");
        });
      }

      function change(path) {
        if (busy) return;
        setBusy(true);
        showError("");
        call(path, "POST").then(function (n) {
          setBusy(false);
          apply(n);
        }).catch(function () {
          fail("Couldn’t save that. Check your connection and try again.");
        });
      }

      var cached = readCache();
      render(cached);
      addBtn.disabled = true;
      undoBtn.disabled = true;

      addBtn.addEventListener("click", function () { change("/increment"); });
      undoBtn.addEventListener("click", function () { change("/decrement"); });
      refresh();
    })();
  </script>
</body>
</html>
